[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avo-hackathon"
version = "0.1.0"
description = "Well-anchored AVO lithology and fluid prediction workflow (FORCE Hackathon 2026)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
